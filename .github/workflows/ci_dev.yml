name: Build, Push and Deploy
on:
  push:
    branches: develop
  pull_request:
    branches: develop
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clean up existing Docker installations
        run: |
          sudo apt-get remove -y docker docker-engine docker.io containerd runc || true
          sudo apt-get autoremove -y

      - name: Install Docker prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg

      - name: Add Docker's official GPG key
        run: |
          sudo install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          sudo chmod a+r /etc/apt/keyrings/docker.gpg

      - name: Set up Docker repository
        run: |
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

      - name: Install Docker Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      - name: Build with Docker Compose
        run: |
          docker compose --env-file .env_dev -p gesafrik-dev build

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image name
        run: |
          # Vérifier si docker-compose.yml existe et extraire le nom de l'image
          if [ -f "docker-compose.yml" ]; then
            IMAGE_NAME=$(docker compose config | grep 'image:' | awk '{print $2}' | head -1 || echo "")
          fi
          
          # Si aucun nom d'image n'est trouvé, utiliser une valeur par défaut
          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="brice99/gesafrikauthservice:dev"
          fi
          
          # Enregistrer le nom de l'image pour les étapes suivantes
          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV
          echo "Using image name: $IMAGE_NAME"

      - name: Push image to Docker Hub
        run: |
          # Tag and push the image
          docker tag $IMAGE_NAME ${{ secrets.DOCKERHUB_USERNAME }}/gesafriknotification:dev
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gesafriknotification:dev
          
          

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload docker-compose.yml and .env_dev to server
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            docker-compose.yml .env_dev \
            ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }}:/gesafrik/gesafriknotification/

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || '22' }}
          script: |
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            cd /gesafrik/gesafriknotification

            docker pull brice99/gesafriknotification:dev
            
            
            docker compose --env-file .env_dev -p gesafrik-dev up -d

            docker ps
