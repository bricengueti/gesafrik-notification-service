# ==============================================
# APPLICATION CONFIGURATION
# ==============================================
spring.application.name=${SPRING_APPLICATION_NAME:gesafrikNotificationService-dev}
server.port=${SERVER_PORT:8088}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api/notification}

# ==============================================
# KAFKA CONFIGURATION
# ==============================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ==============================================
# PRODUCER CONFIGURATION
# ==============================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.compression.type=snappy
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ==============================================
# CONSUMER CONFIGURATION
# ==============================================
spring.kafka.consumer.group-id=gesafrik-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=gesafrik.gesafrikNotification.DTO.NotificationMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=1000

# ==============================================
# TOPIC NAMES
# ==============================================
app.kafka.topics.notification=gesafrik-notifications
app.kafka.topics.email=gesafrik-email-notifications
app.kafka.topics.sms=gesafrik-sms-notifications
app.kafka.topics.push=gesafrik-push-notifications

# ==============================================
# EUREKA CONFIGURATION (EXACTEMENT comme AuthService)
# ==============================================
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

# CRITIQUE : Ajouter instance-id comme dans AuthService
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ==============================================
# EMAIL CONFIGURATION
# ==============================================
spring.mail.host=${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${SPRING_MAIL_USERNAME:f0fded9d1a9550}
spring.mail.password=${SPRING_MAIL_PASSWORD:d488c226a4751f}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}


# ==============================================
# LOGGING CONFIGURATION
# ==============================================
logging.level.org.springframework.kafka=INFO
logging.level.gesafrik.notification=DEBUG
logging.level.org.apache.kafka=WARN

# ==============================================
# HEALTH & MONITORING
# ==============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.kafka.enabled=true

# ======================
# SWAGGER/OPENAPI
# ======================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB