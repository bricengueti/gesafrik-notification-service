# ==============================================
# APPLICATION CONFIGURATION
# ==============================================
spring.application.name=${SPRING_APPLICATION_NAME:gesafrikNotification}
server.port=${SERVER_PORT:8088}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/}

# ==============================================
# KAFKA CONFIGURATION
# ==============================================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ==============================================
# PRODUCER CONFIGURATION
# ==============================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.compression.type=snappy
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ==============================================
# CONSUMER CONFIGURATION
# ==============================================
spring.kafka.consumer.group-id=gesafrik-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=gesafrik.gesafrikNotification.DTO.NotificationMessage
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=1000

# ==============================================
# TOPIC NAMES
# ==============================================
app.kafka.topics.notification=gesafrik-notifications
app.kafka.topics.email=gesafrik-email-notifications
app.kafka.topics.sms=gesafrik-sms-notifications
app.kafka.topics.push=gesafrik-push-notifications

# ==============================================
# EUREKA CLIENT CONFIGURATION
# ==============================================
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE}
eureka.instance.prefer-ip-address=true

# ==============================================
# EMAIL CONFIGURATION
# ==============================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

# ==============================================
# LOGGING CONFIGURATION
# ==============================================
logging.level.org.springframework.kafka=INFO
logging.level.gesafrik.notification=DEBUG
logging.level.org.apache.kafka=WARN

# ==============================================
# HEALTH & MONITORING
# ==============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.kafka.enabled=true
